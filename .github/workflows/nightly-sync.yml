# GitHub Actions: 夜间定时同步
# UTC 18:00 = 北京时间凌晨 2:00
# 串行执行：BM 同步 → 等待 30 分钟 → 每日聚合 → 归因计算

name: Nightly Sync

on:
  schedule:
    - cron: "0 18 * * *"  # UTC 18:00 = 北京时间 02:00
  workflow_dispatch:

jobs:
  bm-sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Sync BM Data
        run: |
          RESPONSE=$(curl -s -w "\n%{http_code}" -X POST "${{ secrets.APP_URL }}/api/sync/bm?secret=${{ secrets.ADMIN_SECRET }}" \
            -H "Content-Type: application/json" \
            --max-time 600)
          
          HTTP_CODE=$(echo "$RESPONSE" | tail -1)
          echo "BM Sync HTTP Status: $HTTP_CODE"
          
          if [ "$HTTP_CODE" != "200" ]; then
            echo "::warning::BM Sync returned status $HTTP_CODE"
          fi

  daily-aggregation:
    needs: bm-sync
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Wait for BM sync to settle
        run: sleep 60
        
      - name: Run Daily Aggregation
        run: |
          YESTERDAY=$(date -d "yesterday" +%Y-%m-%d)
          TODAY=$(date +%Y-%m-%d)
          
          RESPONSE=$(curl -s -w "\n%{http_code}" -X POST "${{ secrets.APP_URL }}/api/dashboard/aggregate?secret=${{ secrets.ADMIN_SECRET }}" \
            -H "Content-Type: application/json" \
            -d "{\"startDate\": \"$YESTERDAY\", \"endDate\": \"$TODAY\", \"options\": {\"syncProduct\": true, \"syncCreative\": true}}" \
            --max-time 600)
          
          HTTP_CODE=$(echo "$RESPONSE" | tail -1)
          echo "Aggregation HTTP Status: $HTTP_CODE"
          
          if [ "$HTTP_CODE" != "200" ]; then
            echo "::error::Daily aggregation failed"
            exit 1
          fi
          
          echo "✅ Daily aggregation completed"

  attribution:
    needs: daily-aggregation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Wait for aggregation to settle
        run: sleep 30
        
      - name: Run Attribution
        run: |
          RESPONSE=$(curl -s -w "\n%{http_code}" -X POST "${{ secrets.APP_URL }}/api/dashboard/attribution/run?secret=${{ secrets.ADMIN_SECRET }}" \
            -H "Content-Type: application/json" \
            -d '{"daysBack": 7}' \
            --max-time 300)
          
          HTTP_CODE=$(echo "$RESPONSE" | tail -1)
          echo "Attribution HTTP Status: $HTTP_CODE"
          
          if [ "$HTTP_CODE" != "200" ]; then
            echo "::error::Attribution failed"
            exit 1
          fi
          
          echo "✅ Attribution completed"

  notify-failure:
    needs: [bm-sync, daily-aggregation, attribution]
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - name: Create Issue on Failure
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `⚠️ 夜间同步失败 — ${new Date().toISOString().split('T')[0]}`,
              body: `夜间定时同步任务执行失败。\n\n- BM 同步: ${{ needs.bm-sync.result }}\n- 每日聚合: ${{ needs.daily-aggregation.result }}\n- 归因计算: ${{ needs.attribution.result }}\n\nWorkflow: ${context.workflow}\nRun: ${context.runId}`,
              labels: ['bug', 'automated']
            });
